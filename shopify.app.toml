# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "7e29cb18bb87ee3285add490f77e9454"
name = "Badgify"
application_url = "https://dev.nazmulcodes.org/app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_metaobjects,write_metaobject_definitions"

[webhooks]
api_version = "2027-01"

  [[webhooks.subscriptions]]
  uri = "https://dev.nazmulcodes.org/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "https://dev.nazmulcodes.org/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[auth]
redirect_urls = [ "https://dev.nazmulcodes.org/api/auth" ]

[build]
automatically_update_urls_on_dev = true
